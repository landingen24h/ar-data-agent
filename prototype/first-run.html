<header class="bar"><div class="row"><a class="btn ghost" href="index.html">Index</a><a class="btn ghost" href="ar/first-run.html" hreflang="ar">العربية</a></div></header>
<section class="card">
<svg class="avatar" role="img" aria-label="Your citizen avatar" viewBox="0 0 56 56"><circle cx="28" cy="28" r="28" fill="var(--color-primary)"/><circle cx="28" cy="22" r="9" fill="var(--color-on-primary)"/><path d="M12 46c3-9 10-13 16-13s13 4 16 13" fill="var(--color-on-primary)"/></svg>
<h1>Meet your citizen</h1>
<p class="muted">Your citizen is an AI agent with its own identity. It learns with you, creates with you and helps you earn credits.</p>
<div class="field"><label for="name">Your name</label><input id="name" name="name" placeholder="What should your citizen call you?" autocomplete="given-name"></div>
<div class="field"><label for="lang">Language</label><select id="lang" name="lang"><option>English</option><option>Arabic</option></select></div>
<a class="btn" href="lobby.html">Start</a>
